<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up for LifeProof - Intelligent University & Career Platform</title>
  <meta name="description"
    content="Create your verified LifeProof account as a Student, Enterprise Recruiter, or Academic Faculty member." />

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <!-- Ambient Glow Elements -->
  <div class="ambient-glow ambient-glow-top"></div>
  <div class="ambient-glow ambient-glow-bottom"></div>

  <!-- Centered Signup Modal -->
  <main class="login-modal-wrapper" style="max-width: 520px;">
    <div class="login-card" id="signupModal" style="padding: 2.25rem 2rem;">

      <!-- Close Button (Returns to Homepage) -->
      <a href="index.html" class="modal-close-btn" id="closeSignupBtn" title="Close and return to Home"
        aria-label="Close and return to Home">
        ✕
      </a>

      <!-- Header -->
      <div class="login-header">
        <a href="index.html" class="login-brand-logo" title="LifeProof Home">
          <img src="assets/logo/logo.svg" alt="LifeProof Logo" />
        </a>
        <h1 class="login-title">Join <span class="gradient-text">LifeProof</span></h1>
        <p class="login-subtitle">Create your verified profile & career portfolio</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector-container">
        <span class="role-selector-label">I AM JOINING AS A</span>
        <div class="role-selector" role="tablist" aria-label="Portal Role Selector">

          <!-- Role: Student (Default Active) -->
          <button type="button" class="role-btn active" data-role="student" id="signupRoleStudentBtn" role="tab"
            aria-selected="true">
            <span class="role-icon">🎓</span>
            <span>Student</span>
          </button>

          <!-- Role: Recruiter -->
          <button type="button" class="role-btn" data-role="recruiter" id="signupRoleRecruiterBtn" role="tab"
            aria-selected="false">
            <span class="role-icon">💼</span>
            <span>Recruiter</span>
          </button>

          <!-- Role: Faculty -->
          <button type="button" class="role-btn" data-role="faculty" id="signupRoleFacultyBtn" role="tab"
            aria-selected="false">
            <span class="role-icon">🏛️</span>
            <span>Faculty</span>
          </button>

        </div>

        <!-- Dynamic Context Hint based on Selected Role -->
        <p class="role-context-hint" id="signupRoleContextHint">
          🎓 Build your verified proof portfolio, get direct recruiter access & earn skill badges.
        </p>
      </div>

      <!-- Alert Box -->
      <div id="signupAlertBanner" class="auth-alert-banner" style="display: none;"></div>

      <!-- Primary Google Sign-Up Button -->
      <div style="margin-bottom: 1.25rem;">
        <button type="button" class="btn-google-auth" id="btnGoogleSignup" style="width: 100%;">
          <svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335" />
          </svg>
          <span>Sign up with Google</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="login-divider" style="margin-bottom: 1.25rem;">
        <span>OR REGISTER WITH DETAILS</span>
      </div>

      <!-- Full Signup Form -->
      <form class="login-form" id="signupForm" novalidate>

        <!-- Full Name -->
        <div class="form-group" style="margin-bottom: 0.85rem;">
          <label for="signupName" class="form-label">Full Name</label>
          <div class="input-field-wrapper">
            <span class="input-icon-left">👤</span>
            <input type="text" id="signupName" class="form-input" placeholder="e.g. Akrit Sharma" required autocomplete="name" />
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group" style="margin-bottom: 0.85rem;">
          <label for="signupEmail" class="form-label">Email Address</label>
          <div class="input-field-wrapper">
            <span class="input-icon-left">✉️</span>
            <input type="email" id="signupEmail" class="form-input" placeholder="name@university.edu or gmail.com"
              required autocomplete="email" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 0.85rem;">
          <label for="signupPassword" class="form-label">Password</label>
          <div class="input-field-wrapper">
            <span class="input-icon-left">🔒</span>
            <input type="password" id="signupPassword" class="form-input" placeholder="Create a strong password (min 6 chars)" required
              autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" id="toggleSignupPasswordBtn" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Role-Specific Fields Container -->
        <div id="signupRoleFieldsContainer" style="background: rgba(255, 255, 255, 0.03); padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: 0.85rem;">
          
          <!-- Student Specific Fields -->
          <div id="signupStudentFields">
            <div class="form-group" style="margin-bottom: 0.65rem;">
              <label class="form-label" style="font-size: 0.78rem;">College / University</label>
              <input type="text" id="suCollege" class="form-input" placeholder="e.g. IIT Bombay / BITS Pilani" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Branch / Major</label>
                <input type="text" id="suBranch" class="form-input" placeholder="e.g. Computer Science" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
              </div>
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Graduation Batch</label>
                <select id="suBatch" class="form-input" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;">
                  <option value="2025">Batch 2025</option>
                  <option value="2026" selected>Batch 2026</option>
                  <option value="2027">Batch 2027</option>
                  <option value="2028">Batch 2028</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Recruiter Specific Fields -->
          <div id="signupRecruiterFields" style="display: none;">
            <div class="form-group" style="margin-bottom: 0.65rem;">
              <label class="form-label" style="font-size: 0.78rem;">Company / Organization</label>
              <input type="text" id="suCompany" class="form-input" placeholder="e.g. Stripe / Google / Microsoft" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Industry Domain</label>
                <input type="text" id="suDomain" class="form-input" placeholder="e.g. FinTech & Cloud" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
              </div>
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Designation</label>
                <input type="text" id="suDesignation" class="form-input" placeholder="e.g. Talent Lead" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
              </div>
            </div>
          </div>

          <!-- Faculty Specific Fields -->
          <div id="signupFacultyFields" style="display: none;">
            <div class="form-group" style="margin-bottom: 0.65rem;">
              <label class="form-label" style="font-size: 0.78rem;">Institute Name</label>
              <input type="text" id="suFacultyInstitute" class="form-input" placeholder="e.g. National Institute of Tech" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Department</label>
                <input type="text" id="suFacultyDept" class="form-input" placeholder="e.g. Computer Science" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
              </div>
              <div>
                <label class="form-label" style="font-size: 0.78rem;">Academic Role</label>
                <input type="text" id="suFacultyRole" class="form-input" placeholder="e.g. Placement Head" style="padding: 0.5rem 0.8rem; font-size: 0.84rem;" />
              </div>
            </div>
          </div>

        </div>

        <!-- Terms Agreement -->
        <div class="form-options-row" style="margin-bottom: 1rem;">
          <label class="remember-me-label" style="font-size: 0.78rem;">
            <input type="checkbox" id="agreeTerms" checked required />
            <span>I agree to LifeProof verified portfolio terms & data protection</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-login" id="signupSubmitBtn" style="width: 100%;">
          <span>Create Account & Enter Platform</span>
          <span>&rarr;</span>
        </button>

      </form>

      <!-- Footer / Switch to Sign In -->
      <div class="login-card-footer" style="margin-top: 1.25rem;">
        <span>Already have an account?</span>
        <a href="login.html" class="create-account-link" id="goToLoginLink" style="font-weight: 700;">Sign In &rarr;</a>
      </div>

      <!-- Security Status Banner -->
      <div class="auth-status-banner">
        <span>🔒</span>
        <span>Cryptographic Proof & Firebase Authentication Ready</span>
      </div>

    </div>
  </main>

  <!-- Modular Scripts -->
  <script src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>

</html>
